openapi: 3.1.0
info:
  title: StepsTracker API
  version: 1.0.0
servers:
  - url: https://steps.example.com/api/v1
paths:
  /auth/register:
    post:
      summary: Register an account
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Credentials'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Tokens'}}}}}
  /auth/login:
    post:
      summary: Start a session
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Credentials'}}}}
      responses: {'200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Tokens'}}}}}
  /auth/refresh:
    post:
      summary: Rotate the refresh token
      responses: {'200': {description: New tokens}}
  /auth/logout:
    post:
      summary: Revoke the refresh token
      responses: {'204': {description: Revoked}}
  /me:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Current user}}}
    delete: {security: [{bearerAuth: []}], responses: {'204': {description: Account deleted}}}
  /me/profile:
    put: {security: [{bearerAuth: []}], responses: {'200': {description: Profile updated}}}
  /me/weight-history:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Weight history ordered from newest to oldest}}}
  /steps/batch:
    post: {security: [{bearerAuth: []}], responses: {'200': {description: Idempotent batch result}}}
  /steps:
    get: {security: [{bearerAuth: []}], parameters: [{in: query, name: from, required: true, schema: {type: string, format: date-time}}, {in: query, name: to, required: true, schema: {type: string, format: date-time}}], responses: {'200': {description: Intervals}}}
  /stats/daily:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Daily totals}}}
  /stats/timeline:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Time series}}}
  /stats/time-of-day:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Average per quarter hour}}}
  /stats/summary:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Summary and comparison}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string, minLength: 10}}
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds]
      properties: {accessToken: {type: string}, refreshToken: {type: string}, expiresInSeconds: {type: integer}}
